<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="40%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="60%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#6C63FF">
        <animate attributeName="stop-color" values="#6C63FF;#00D4FF;#6C63FF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#6C63FF" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orbital gradient -->
    <linearGradient id="orbitGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(108,99,255,0)"/>
      <stop offset="50%" stop-color="rgba(108,99,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(108,99,255,0)"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,212,255,0)"/>
      <stop offset="50%" stop-color="rgba(0,212,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,212,255,0)"/>
    </linearGradient>

    <!-- Constellation line gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(108,99,255,0.05)"/>
      <stop offset="50%" stop-color="rgba(108,99,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(108,99,255,0.05)"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes twinkle1 { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    @keyframes twinkle2 { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes twinkle3 { 0%,100% { opacity: 0.1; } 50% { opacity: 0.7; } }
    @keyframes float1 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
    @keyframes float2 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(3px); } }
    @keyframes pulse { 0%,100% { opacity: 0.4; r: 2; } 50% { opacity: 1; r: 3; } }
    @keyframes orbitPulse { 0%,100% { stroke-opacity: 0.08; } 50% { stroke-opacity: 0.2; } }
    @keyframes dashMove { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -30; } }

    .s1 { animation: twinkle1 3s ease-in-out infinite; }
    .s2 { animation: twinkle2 4s ease-in-out infinite; }
    .s3 { animation: twinkle3 5s ease-in-out infinite; }
    .s4 { animation: twinkle1 3.5s ease-in-out infinite; }
    .s5 { animation: twinkle2 2.5s ease-in-out infinite; }
    .s6 { animation: twinkle3 4.5s ease-in-out infinite; }

    .accent-dot { animation: pulse 3s ease-in-out infinite; }
    .accent-dot2 { animation: pulse 4s ease-in-out 1s infinite; }

    .orbit1 { animation: orbitPulse 6s ease-in-out infinite; }
    .orbit2 { animation: orbitPulse 8s ease-in-out 2s infinite; }
    .orbit3 { animation: orbitPulse 7s ease-in-out 1s infinite; }

    .data-stream { stroke-dasharray: 4 26; animation: dashMove 3s linear infinite; }

    text.title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      letter-spacing: 6px;
    }
    text.subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      letter-spacing: 5px;
    }
    text.tag {
      font-family: 'Courier New', monospace;
      font-weight: 400;
      letter-spacing: 2px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="320" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="320" stroke="#6C63FF" stroke-width="0.5"/>
  </g>

  <!-- Constellation lines -->
  <g stroke="url(#lineGrad)" stroke-width="0.5" fill="none">
    <line x1="120" y1="45" x2="190" y2="72"/>
    <line x1="190" y1="72" x2="280" y2="55"/>
    <line x1="280" y1="55" x2="320" y2="90"/>
    <line x1="850" y1="40" x2="920" y2="68"/>
    <line x1="920" y1="68" x2="980" y2="45"/>
    <line x1="980" y1="45" x2="1050" y2="75"/>
    <line x1="100" y1="230" x2="170" y2="260"/>
    <line x1="170" y1="260" x2="250" y2="240"/>
    <line x1="900" y1="240" x2="970" y2="265"/>
    <line x1="970" y1="265" x2="1060" y2="250"/>
    <line x1="1060" y1="250" x2="1100" y2="275"/>
  </g>

  <!-- Orbital rings -->
  <ellipse cx="600" cy="155" rx="420" ry="65" fill="none" stroke="#6C63FF" stroke-width="0.5" class="orbit1" opacity="0.1"/>
  <ellipse cx="600" cy="155" rx="350" ry="45" fill="none" stroke="#00D4FF" stroke-width="0.3" class="orbit2" opacity="0.08" transform="rotate(-8 600 155)"/>
  <ellipse cx="600" cy="155" rx="480" ry="80" fill="none" stroke="#6C63FF" stroke-width="0.3" class="orbit3" opacity="0.06" transform="rotate(5 600 155)"/>

  <!-- Data streams on orbits -->
  <ellipse cx="600" cy="155" rx="420" ry="65" fill="none" stroke="#6C63FF" stroke-width="1" class="data-stream" opacity="0.2"/>
  <ellipse cx="600" cy="155" rx="350" ry="45" fill="none" stroke="#00D4FF" stroke-width="0.8" class="data-stream" opacity="0.15" transform="rotate(-8 600 155)" style="animation-duration:4s;animation-direction:reverse"/>

  <!-- Stars Layer 1 - Tiny background stars -->
  <circle cx="45" cy="25" r="0.8" fill="#fff" class="s1"/>
  <circle cx="130" cy="15" r="0.6" fill="#e8e8ff" class="s3"/>
  <circle cx="200" cy="35" r="0.7" fill="#fff" class="s2"/>
  <circle cx="310" cy="18" r="0.5" fill="#ccd0ff" class="s4"/>
  <circle cx="380" cy="42" r="0.8" fill="#fff" class="s1" style="animation-delay:0.5s"/>
  <circle cx="450" cy="12" r="0.6" fill="#e8e8ff" class="s5"/>
  <circle cx="520" cy="38" r="0.7" fill="#fff" class="s3" style="animation-delay:1s"/>
  <circle cx="680" cy="20" r="0.5" fill="#ccd0ff" class="s2"/>
  <circle cx="750" cy="45" r="0.8" fill="#fff" class="s6"/>
  <circle cx="830" cy="15" r="0.6" fill="#e8e8ff" class="s1" style="animation-delay:1.5s"/>
  <circle cx="950" cy="30" r="0.7" fill="#fff" class="s4"/>
  <circle cx="1020" cy="50" r="0.5" fill="#ccd0ff" class="s2" style="animation-delay:0.8s"/>
  <circle cx="1100" cy="22" r="0.8" fill="#fff" class="s5"/>
  <circle cx="1160" cy="48" r="0.6" fill="#e8e8ff" class="s3" style="animation-delay:2s"/>

  <!-- Stars Layer 2 - Mid stars -->
  <circle cx="75" cy="80" r="1" fill="#fff" class="s2" style="animation-delay:0.3s"/>
  <circle cx="160" cy="100" r="0.8" fill="#d4d0ff" class="s4" style="animation-delay:1.2s"/>
  <circle cx="250" cy="75" r="1.2" fill="#fff" class="s1"/>
  <circle cx="350" cy="95" r="0.7" fill="#e8e8ff" class="s5" style="animation-delay:0.7s"/>
  <circle cx="440" cy="82" r="0.9" fill="#fff" class="s3" style="animation-delay:2.2s"/>
  <circle cx="760" cy="88" r="1" fill="#d4d0ff" class="s2" style="animation-delay:1.8s"/>
  <circle cx="870" cy="75" r="0.8" fill="#fff" class="s6"/>
  <circle cx="960" cy="95" r="1.1" fill="#e8e8ff" class="s1" style="animation-delay:0.4s"/>
  <circle cx="1070" cy="80" r="0.7" fill="#fff" class="s4" style="animation-delay:1.6s"/>
  <circle cx="1140" cy="100" r="0.9" fill="#d4d0ff" class="s3"/>

  <!-- Stars Layer 3 - Bottom stars -->
  <circle cx="55" cy="250" r="0.9" fill="#fff" class="s5" style="animation-delay:0.6s"/>
  <circle cx="140" cy="270" r="0.7" fill="#e8e8ff" class="s2" style="animation-delay:1.4s"/>
  <circle cx="230" cy="255" r="1" fill="#fff" class="s4"/>
  <circle cx="340" cy="275" r="0.6" fill="#ccd0ff" class="s1" style="animation-delay:2.1s"/>
  <circle cx="430" cy="260" r="0.8" fill="#fff" class="s3" style="animation-delay:0.9s"/>
  <circle cx="500" cy="280" r="0.7" fill="#e8e8ff" class="s6" style="animation-delay:1.7s"/>
  <circle cx="700" cy="265" r="0.9" fill="#fff" class="s2"/>
  <circle cx="780" cy="250" r="0.6" fill="#d4d0ff" class="s5" style="animation-delay:0.2s"/>
  <circle cx="860" cy="275" r="1" fill="#fff" class="s1" style="animation-delay:1.3s"/>
  <circle cx="940" cy="258" r="0.7" fill="#e8e8ff" class="s4" style="animation-delay:2.4s"/>
  <circle cx="1040" cy="270" r="0.8" fill="#fff" class="s3" style="animation-delay:0.5s"/>
  <circle cx="1120" cy="255" r="0.6" fill="#ccd0ff" class="s6" style="animation-delay:1.1s"/>
  <circle cx="1170" cy="280" r="0.9" fill="#fff" class="s2" style="animation-delay:1.9s"/>

  <!-- Stars Layer 4 - Side accent stars -->
  <circle cx="25" cy="150" r="1.2" fill="#fff" class="s1" style="animation-delay:0.8s"/>
  <circle cx="85" cy="180" r="0.8" fill="#d4d0ff" class="s4" style="animation-delay:2.3s"/>
  <circle cx="55" cy="120" r="0.6" fill="#e8e8ff" class="s2"/>
  <circle cx="1175" cy="140" r="1" fill="#fff" class="s5" style="animation-delay:0.3s"/>
  <circle cx="1130" cy="175" r="0.7" fill="#d4d0ff" class="s3" style="animation-delay:1.6s"/>
  <circle cx="1155" cy="110" r="0.9" fill="#e8e8ff" class="s1" style="animation-delay:2.5s"/>

  <!-- Accent constellation nodes -->
  <circle cx="120" cy="45" r="1.8" fill="#6C63FF" class="accent-dot" filter="url(#softGlow)"/>
  <circle cx="190" cy="72" r="1.5" fill="#6C63FF" class="accent-dot2"/>
  <circle cx="280" cy="55" r="1.8" fill="#6C63FF" class="accent-dot"/>
  <circle cx="320" cy="90" r="1.3" fill="#6C63FF" class="accent-dot2"/>
  <circle cx="850" cy="40" r="1.5" fill="#00D4FF" class="accent-dot" filter="url(#softGlow)"/>
  <circle cx="920" cy="68" r="1.8" fill="#00D4FF" class="accent-dot2"/>
  <circle cx="980" cy="45" r="1.3" fill="#00D4FF" class="accent-dot"/>
  <circle cx="1050" cy="75" r="1.5" fill="#00D4FF" class="accent-dot2"/>
  <circle cx="100" cy="230" r="1.5" fill="#6C63FF" class="accent-dot2"/>
  <circle cx="170" cy="260" r="1.8" fill="#6C63FF" class="accent-dot"/>
  <circle cx="250" cy="240" r="1.3" fill="#6C63FF" class="accent-dot2"/>
  <circle cx="900" cy="240" r="1.8" fill="#00D4FF" class="accent-dot"/>
  <circle cx="970" cy="265" r="1.5" fill="#00D4FF" class="accent-dot2"/>
  <circle cx="1060" cy="250" r="1.3" fill="#00D4FF" class="accent-dot"/>
  <circle cx="1100" cy="275" r="1.8" fill="#00D4FF" class="accent-dot2"/>

  <!-- Floating accent dots on orbits -->
  <circle cx="180" cy="160" r="2.5" fill="#6C63FF" class="accent-dot" filter="url(#softGlow)" opacity="0.7"/>
  <circle cx="1020" cy="150" r="2.5" fill="#00D4FF" class="accent-dot2" filter="url(#softGlow)" opacity="0.7"/>
  <circle cx="600" cy="90" r="2" fill="#a78bfa" class="accent-dot" filter="url(#softGlow)" opacity="0.5"/>
  <circle cx="600" cy="220" r="2" fill="#a78bfa" class="accent-dot2" filter="url(#softGlow)" opacity="0.5"/>

  <!-- Main text - Name -->
  <text x="600" y="145" text-anchor="middle" class="title" font-size="52" fill="url(#nameGrad)" filter="url(#textGlow)">
    VISHNU GUPTA
  </text>

  <!-- Subtitle -->
  <text x="600" y="178" text-anchor="middle" class="subtitle" font-size="13" fill="#8B949E" opacity="0.9">
    SOFTWARE ENGINEER  ·  AI BUILDER  ·  SYSTEMS ARCHITECT
  </text>

  <!-- Tags -->
  <g opacity="0.5">
    <text x="600" y="210" text-anchor="middle" class="tag" font-size="10" fill="#6C63FF">
      [ Samsung PRISM  ·  IEEE Published  ·  AWS Certified  ·  CodeVita Top 500 ]
    </text>
  </g>

  <!-- Bottom accent line -->
  <line x1="400" y1="240" x2="800" y2="240" stroke="url(#orbitGrad1)" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="245" x2="750" y2="245" stroke="url(#orbitGrad2)" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner decorations -->
  <g opacity="0.15">
    <!-- Top-left corner -->
    <line x1="15" y1="15" x2="15" y2="45" stroke="#6C63FF" stroke-width="1"/>
    <line x1="15" y1="15" x2="45" y2="15" stroke="#6C63FF" stroke-width="1"/>
    <!-- Top-right corner -->
    <line x1="1185" y1="15" x2="1185" y2="45" stroke="#00D4FF" stroke-width="1"/>
    <line x1="1185" y1="15" x2="1155" y2="15" stroke="#00D4FF" stroke-width="1"/>
    <!-- Bottom-left corner -->
    <line x1="15" y1="305" x2="15" y2="275" stroke="#6C63FF" stroke-width="1"/>
    <line x1="15" y1="305" x2="45" y2="305" stroke="#6C63FF" stroke-width="1"/>
    <!-- Bottom-right corner -->
    <line x1="1185" y1="305" x2="1185" y2="275" stroke="#00D4FF" stroke-width="1"/>
    <line x1="1185" y1="305" x2="1155" y2="305" stroke="#00D4FF" stroke-width="1"/>
  </g>

  <!-- Status indicator -->
  <g transform="translate(540, 270)">
    <circle cx="0" cy="0" r="3" fill="#00E676" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" font-family="'Courier New', monospace" font-size="10" fill="#00E676" opacity="0.6" letter-spacing="1">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Subtle vignette overlay -->
  <rect width="1200" height="320" fill="url(#bg)" opacity="0" rx="0"/>
</svg>
